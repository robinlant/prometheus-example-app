name: Check Helm Chart

on:
  pull_request:
    paths:
      - charts/**
      - .github/workflows/check.yaml
      - .github/workflows/release.yaml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint charts/prometheus-example-app

      - name: Render chart
        run: helm template test charts/prometheus-example-app

      - name: Render chart with optional values
        run: |
          helm template test charts/prometheus-example-app \
            --set-string deployment.annotations.example=true \
            --set-string deployment.labels.example=true \
            --set-string pod.annotations.example=true \
            --set-string pod.labels.example=true \
            --set-string service.annotations.example=true \
            --set-string service.labels.example=true \
            --set resources.requests.cpu=10m \
            --set 'imagePullSecrets[0].name=regcred' \
            --set serviceMonitor.enabled=true \
            --set-string serviceMonitor.labels.release=prometheus \
            --set podMonitor.enabled=true \
            --set-string podMonitor.labels.release=prometheus
